<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="../lib/gate.js" data-game="stack" data-title="つみあげタワー" data-hash="fc777e91dcb5c1ddcdd168453075b326592a3a5500ef05a0a9b4076c13884512"></script>
<title>つみあげタワー</title>
<meta name="theme-color" content="#1b1f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゲームズ">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1b1f3b;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: fixed; left: 0; right: 0;
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    text-align: center; pointer-events: none;
    transition: opacity .3s;
  }
  #score { font-size: 64px; font-weight: 800; line-height: 1; text-shadow: 0 3px 12px rgba(0,0,0,.25); }
  #best  { margin-top: 6px; font-size: 14px; opacity: .85; font-weight: 600; }

  .panel {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; pointer-events: none;
    transition: opacity .35s;
  }
  .panel.hidden { opacity: 0; }
  .title { font-size: 40px; font-weight: 900; letter-spacing: .04em; text-shadow: 0 4px 16px rgba(0,0,0,.3); }
  .sub   { font-size: 15px; line-height: 1.7; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
  .tap   { margin-top: 18px; font-size: 18px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.45); animation: blink 1.2s ease-in-out infinite; }
  .big   { font-size: 72px; font-weight: 900; line-height: 1; }
  .newbest { font-size: 18px; font-weight: 800; color: #ffe066; }
  #backBtn {
    position: fixed; z-index: 10;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: calc(env(safe-area-inset-left, 0px) + 14px);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,.25); color: #fff;
    font-size: 22px; line-height: 44px; text-align: center; text-decoration: none;
    pointer-events: auto;
  }
  #muteBtn {
    position: fixed; z-index: 10;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    width: 44px; height: 44px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.25); color: #fff;
    font-size: 22px; line-height: 44px; text-align: center;
    pointer-events: auto; cursor: pointer;
  }
  @keyframes blink { 50% { opacity: .35; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a id="backBtn" href="../" aria-label="ゲーム一覧にもどる">←</a>
<button id="muteBtn" aria-label="音のオン・オフ">🔊</button>

<div id="hud" class="hidden" style="opacity:0">
  <div id="score">0</div>
  <div id="best">BEST 0</div>
</div>

<div id="startPanel" class="panel">
  <div class="title">つみあげタワー</div>
  <div class="sub">動くブロックをタップして積み上げよう<br>ぴったり重ねると PERFECT！</div>
  <div class="tap">タップしてスタート</div>
</div>

<div id="overPanel" class="panel hidden">
  <div class="sub">スコア</div>
  <div class="big" id="finalScore">0</div>
  <div class="newbest" id="newBest" style="display:none">ベスト更新！</div>
  <div class="sub" id="finalBest">BEST 0</div>
  <div class="tap">タップしてもう一回</div>
</div>

<script>
window.gateReady.then(() => {   // パスワードが通るまで待つ
  'use strict';

  // ===== 設定 =====
  const GAME_W = 400;          // 論理的な横幅（画面幅に合わせて拡大縮小）
  const BLOCK_H = 30;          // ブロックの高さ
  const BASE_W = 220;          // 最初のブロックの幅
  const PERFECT_RANGE = 5;     // これ以内のズレなら PERFECT
  const STORAGE_KEY = 'stack-tower-best';
  const MUTE_KEY = 'stack-tower-muted';

  // ===== キャンバス =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, H = 700, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    scale = cw / GAME_W;
    H = ch / scale;
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== ベストスコア（保存できない環境でも落ちないように） =====
  function loadBest() {
    try { return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem(STORAGE_KEY, String(v)); } catch (e) {}
  }

  // ===== サウンド（最初のタップのあとに使えるようになる） =====
  let audio = null;
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
  const muteBtn = document.getElementById('muteBtn');
  function showMute() { muteBtn.textContent = muted ? '🔇' : '🔊'; }
  showMute();
  // ボタンを押してもゲームのタップにならないようにする
  // もどるボタン：ゲームのタップにならないようにして一覧へ
  document.getElementById('backBtn').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    location.href = '../';
  });
  muteBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (err) {}
    showMute();
  });
  function initAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    }
    if (audio && audio.state === 'suspended') audio.resume();
  }
  function beep(freq, dur = 0.12, type = 'sine', vol = 0.18, slideTo = null) {
    if (!audio || muted) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const g = audio.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }
  const sfx = {
    place()        { beep(330, 0.09, 'triangle', 0.16); },
    perfect(combo) { const f = 523 * Math.pow(2, Math.min(combo - 1, 12) / 12); beep(f, 0.18, 'sine', 0.2); beep(f * 1.5, 0.18, 'sine', 0.08); },
    grow()         { beep(660, 0.25, 'sine', 0.15, 1320); },
    over()         { beep(300, 0.6, 'sawtooth', 0.12, 70); },
  };

  // ===== ゲームの状態 =====
  let state = 'title';   // title | play | falling | over
  let stack, current, debris, effects, cam, camTarget, hueStart, combo, best, overTimer, bgHue;

  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startPanel = document.getElementById('startPanel');
  const overPanel = document.getElementById('overPanel');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newBest = document.getElementById('newBest');

  function groundY() { return H - 90; }
  function blockColor(level, light = 0) {
    const h = (hueStart + level * 8) % 360;
    return `hsl(${h}, 68%, ${58 + light}%)`;
  }

  function reset() {
    hueStart = Math.floor(Math.random() * 360);
    bgHue = hueStart;
    stack = [{ x: (GAME_W - BASE_W) / 2, w: BASE_W, level: 0 }];
    debris = [];
    effects = [];
    combo = 0;
    cam = 0; camTarget = 0;
    best = loadBest();
    spawnNext();
    updateHud();
  }

  function score() { return stack.length - 1; }

  function spawnNext() {
    const top = stack[stack.length - 1];
    const level = top.level + 1;
    const fromLeft = level % 2 === 1;
    const speed = Math.min(150 + level * 7, 430);
    current = {
      x: fromLeft ? -top.w * 0.6 : GAME_W - top.w * 0.4,
      w: top.w,
      level,
      dir: fromLeft ? 1 : -1,
      speed,
    };
    // カメラ：今のブロックが画面の上から35%くらいに来るように
    camTarget = Math.max(0, H * 0.35 - groundY() + (level + 1) * BLOCK_H);
  }

  function updateHud() {
    scoreEl.textContent = score();
    bestEl.textContent = 'BEST ' + Math.max(best, score());
  }

  function blockScreenY(level) {
    return groundY() - (level + 1) * BLOCK_H + cam;
  }

  // ===== ブロックを落とす =====
  function drop() {
    const top = stack[stack.length - 1];
    const cur = current;
    const diff = cur.x - top.x;

    if (Math.abs(diff) <= PERFECT_RANGE) {
      // PERFECT！
      combo++;
      let w = top.w;
      let x = top.x;
      // 3回連続 PERFECT ごとに少し幅が広がる
      let grew = false;
      if (combo >= 3 && combo % 3 === 0 && w < BASE_W) {
        const add = Math.min(14, BASE_W - w);
        w += add; x -= add / 2;
        grew = true;
      }
      stack.push({ x, w, level: cur.level });
      effects.push({ type: 'ring', x: x + w / 2, level: cur.level, w, t: 0 });
      effects.push({ type: 'text', text: combo >= 2 ? `PERFECT ×${combo}` : 'PERFECT!', x: GAME_W / 2, level: cur.level, t: 0 });
      if (grew) { sfx.grow(); effects.push({ type: 'text', text: 'ブロックが広がった！', x: GAME_W / 2, level: cur.level + 1.2, t: 0, small: true }); }
      else sfx.perfect(combo);
      vibrate(15);
    } else {
      const start = Math.max(cur.x, top.x);
      const end = Math.min(cur.x + cur.w, top.x + top.w);
      const overlap = end - start;

      if (overlap <= 0) {
        // 完全にハズレ → ゲームオーバー
        debris.push(makeDebris(cur.x, cur.w, cur.level, diff > 0 ? 1 : -1));
        current = null;
        gameOver();
        return;
      }

      combo = 0;
      // はみ出た部分を落とす
      if (diff > 0) debris.push(makeDebris(end, cur.x + cur.w - end, cur.level, 1));
      else          debris.push(makeDebris(cur.x, start - cur.x, cur.level, -1));

      stack.push({ x: start, w: overlap, level: cur.level });
      sfx.place();
    }

    updateHud();
    spawnNext();
  }

  function makeDebris(x, w, level, side) {
    return {
      x, w, level,
      y: blockScreenY(level) - cam,   // カメラを除いた位置
      vy: 0,
      vx: side * (40 + Math.random() * 40),
      rot: 0,
      vr: side * (1.5 + Math.random() * 2),
      alpha: 1,
    };
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  function gameOver() {
    state = 'falling';
    sfx.over();
    vibrate(80);
    overTimer = 0;
    const s = score();
    const isNew = s > best;
    if (isNew) { best = s; saveBest(s); }
    finalScore.textContent = s;
    finalBest.textContent = 'BEST ' + best;
    newBest.style.display = isNew && s > 0 ? 'block' : 'none';
  }

  // ===== 入力 =====
  let lastTap = 0;
  function onTap(e) {
    if (e) e.preventDefault();
    initAudio();
    const now = performance.now();
    if (now - lastTap < 60) return;
    lastTap = now;

    if (state === 'title') {
      startPanel.classList.add('hidden');
      hud.style.opacity = 1;
      state = 'play';
    } else if (state === 'play') {
      drop();
    } else if (state === 'over' && overTimer > 0.6) {
      overPanel.classList.add('hidden');
      reset();
      hud.style.opacity = 1;
      state = 'play';
    }
  }
  window.addEventListener('pointerdown', onTap, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'Enter') onTap(e);
  });
  // iOSのダブルタップ拡大・長押しメニュー対策
  document.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ===== 更新 =====
  function update(dt) {
    if (state === 'play' && current) {
      current.x += current.dir * current.speed * dt;
      const minX = -current.w * 0.6;
      const maxX = GAME_W - current.w * 0.4;
      if (current.x > maxX) { current.x = maxX; current.dir = -1; }
      if (current.x < minX) { current.x = minX; current.dir = 1; }
    }

    if (state === 'title') {
      // タイトル画面でもブロックをゆっくり動かしておく
      current.x += current.dir * 90 * dt;
      const minX = -current.w * 0.6, maxX = GAME_W - current.w * 0.4;
      if (current.x > maxX) { current.x = maxX; current.dir = -1; }
      if (current.x < minX) { current.x = minX; current.dir = 1; }
    }

    if (state === 'falling' || state === 'over') {
      overTimer += dt;
      if (overTimer > 0.9 && state === 'falling') {
        state = 'over';
        overPanel.classList.remove('hidden');
        hud.style.opacity = 0;
      }
    }

    cam += (camTarget - cam) * Math.min(1, dt * 6);
    bgHue += ((hueStart + score() * 8) - bgHue) * Math.min(1, dt * 2);

    for (const d of debris) {
      d.vy += 1400 * dt;
      d.y += d.vy * dt;
      d.x += d.vx * dt;
      d.rot += d.vr * dt;
      if (d.y + cam > H + 200) d.alpha = 0;
    }
    debris = debris.filter(d => d.alpha > 0);

    for (const ef of effects) ef.t += dt;
    effects = effects.filter(ef => ef.t < 1);
  }

  // ===== 描画 =====
  function drawBlock(x, y, w, level, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = blockColor(level);
    ctx.fillRect(x, y, w, BLOCK_H);
    // 上の明るいフチ
    ctx.fillStyle = blockColor(level, 14);
    ctx.fillRect(x, y, w, 5);
    // 下の影
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(x, y + BLOCK_H - 4, w, 4);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);

    // 背景：高く積むほど空が暗くなって宇宙っぽくなる
    const height = score();
    const dark = Math.min(height / 60, 1);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, `hsl(${(bgHue + 200) % 360}, 45%, ${70 - dark * 58}%)`);
    g.addColorStop(1, `hsl(${(bgHue + 160) % 360}, 50%, ${85 - dark * 60}%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, GAME_W, H);

    // 星（暗くなってきたら出てくる）
    if (dark > 0.3) {
      ctx.fillStyle = `rgba(255,255,255,${(dark - 0.3) * 1.2})`;
      for (let i = 0; i < 40; i++) {
        const sx = (i * 97.3) % GAME_W;
        const sy = ((i * 53.7) + cam * 0.2) % H;
        ctx.fillRect(sx, sy, 2, 2);
      }
    }

    // 地面
    const gy = groundY() + cam;
    if (gy < H) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, gy, GAME_W, H - gy);
    }

    // 積んだブロック（画面内だけ描く）
    for (const b of stack) {
      const y = blockScreenY(b.level);
      if (y > H || y < -BLOCK_H) continue;
      drawBlock(b.x, y, b.w, b.level);
    }

    // 動いているブロック
    if (current && (state === 'play' || state === 'title')) {
      drawBlock(current.x, blockScreenY(current.level), current.w, current.level);
    }

    // 落ちていくかけら
    for (const d of debris) {
      ctx.save();
      ctx.translate(d.x + d.w / 2, d.y + cam + BLOCK_H / 2);
      ctx.rotate(d.rot);
      drawBlock(-d.w / 2, -BLOCK_H / 2, d.w, d.level, d.alpha);
      ctx.restore();
    }

    // エフェクト
    for (const ef of effects) {
      const y = blockScreenY(ef.level);
      const p = ef.t;
      if (ef.type === 'ring') {
        ctx.strokeStyle = `rgba(255,255,255,${1 - p})`;
        ctx.lineWidth = 3;
        const pad = p * 18;
        ctx.strokeRect(ef.x - ef.w / 2 - pad, y - pad, ef.w + pad * 2, BLOCK_H + pad * 2);
      } else if (ef.type === 'text') {
        ctx.globalAlpha = 1 - p;
        ctx.fillStyle = '#fff';
        ctx.font = `800 ${ef.small ? 16 : 22}px -apple-system, "Hiragino Sans", sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(ef.text, ef.x, y - 14 - p * 30);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ===== メインループ =====
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 20);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);

  // ===== オフライン対応（Service Worker） =====
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      // 古い版の Service Worker（stack/sw.js）を片付けてから、サイト全体のものを使う
      navigator.serviceWorker.getRegistrations().then((regs) => {
        regs.forEach((r) => { if (r.scope.endsWith('/stack/')) r.unregister(); });
      }).catch(() => {});
      navigator.serviceWorker.register('../sw.js').catch(() => {});
    });
  }
});
</script>
</body>
</html>
