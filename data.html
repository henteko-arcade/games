<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>セーブデータの引っこし</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    background: radial-gradient(circle at 20% 0%, #2b2f66 0%, #151833 55%, #0e1024 100%) fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 18px 40px;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .lead { font-size: 14px; opacity: .8; line-height: 1.7; margin: 0 0 18px; }
  section { background: rgba(255,255,255,.08); border-radius: 18px; padding: 16px; margin-bottom: 16px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.7; opacity: .85; margin: 0 0 10px; }
  textarea { width: 100%; height: 110px; border-radius: 12px; border: 2px solid rgba(255,255,255,.2); background: rgba(0,0,0,.25); color: #fff; padding: 10px; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  button { width: 100%; margin-top: 10px; padding: 13px; border: none; border-radius: 14px; font-size: 16px; font-weight: 900; background: #ffcf3f; color: #4a2d00; }
  button.green { background: #5fbf6a; color: #fff; }
  .msg { font-size: 14px; font-weight: 800; margin-top: 10px; min-height: 20px; }
  ul { font-size: 13px; opacity: .85; padding-left: 20px; margin: 6px 0 0; line-height: 1.7; }
  a { color: #fff; opacity: .7; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>📦 セーブデータの引っこし</h1>
  <p class="lead">サイトのURLが変わると、セーブデータは引き継がれないよ。<br>①前のサイトでコードをコピー → ②新しいサイトで貼りつけ、で元に戻せるよ。</p>

  <section>
    <h2>① 引っこしコードを作る（前のサイトで）</h2>
    <p>このiPhoneに入っているゲームのセーブデータ：</p>
    <ul id="list"></ul>
    <button id="makeBtn">コードを作ってコピー</button>
    <textarea id="outCode" readonly placeholder="ここにコードが出るよ"></textarea>
    <div class="msg" id="outMsg"></div>
    <p>コピーしたコードは、メモアプリなどに貼りつけて保存しておいてね。</p>
  </section>

  <section>
    <h2>② コードを貼りつける（新しいサイトで）</h2>
    <textarea id="inCode" placeholder="ここにコードを貼りつけ"></textarea>
    <button class="green" id="loadBtn">セーブデータをもどす</button>
    <div class="msg" id="inMsg"></div>
  </section>

  <a href="./">← ゲーム一覧にもどる</a>
</main>
<script>
  // ゲームのセーブ（パスワードを入れたかどうかもふくむ）
  const PREFIXES = ['heist-', 'mart-', 'stack-', 'brawl-', 'gate-'];
  const NAMES = { 'heist-save': 'ぬすめ！ヘンテコ', 'mart-save': 'わくわくマート', 'stack-tower-best': 'つみあげタワー', 'brawl-wins': 'ふっとばしバトル' };
  const gameKeys = () => Object.keys(localStorage).filter(k => PREFIXES.some(p => k.startsWith(p)));

  const list = document.getElementById('list');
  const found = gameKeys().filter(k => NAMES[k]).map(k => NAMES[k]);
  list.innerHTML = found.length ? found.map(n => `<li>${n}</li>`).join('') : '<li>まだセーブデータがないよ</li>';

  // 日本語もそのまま入るように、UTF-8 にしてから base64 にする
  const enc = (str) => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
  const dec = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

  document.getElementById('makeBtn').addEventListener('click', async () => {
    const data = {};
    for (const k of gameKeys()) data[k] = localStorage.getItem(k);
    const code = 'TG1:' + enc(JSON.stringify(data));
    const out = document.getElementById('outCode'), msg = document.getElementById('outMsg');
    out.value = code;
    try { await navigator.clipboard.writeText(code); msg.textContent = '✅ コピーしたよ！'; }
    catch (e) { out.select(); msg.textContent = '👆 上のコードを長押ししてコピーしてね'; }
  });

  document.getElementById('loadBtn').addEventListener('click', () => {
    const msg = document.getElementById('inMsg');
    const code = document.getElementById('inCode').value.trim();
    try {
      if (!code.startsWith('TG1:')) throw new Error();
      const data = JSON.parse(dec(code.slice(4)));
      const keys = Object.keys(data).filter(k => PREFIXES.some(p => k.startsWith(p)));
      if (!keys.length) throw new Error();
      if (!confirm('今このサイトにあるセーブデータは上書きされるよ。もどしていい？')) return;
      for (const k of keys) localStorage.setItem(k, data[k]);
      msg.textContent = `✅ もどしたよ！（${keys.filter(k => NAMES[k]).map(k => NAMES[k]).join('・') || 'データ'}）`;
    } catch (e) {
      msg.textContent = '❌ コードが正しくないみたい。もう一度コピーしてみてね';
    }
  });
</script>
</body>
</html>
