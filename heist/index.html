<style>

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #8fd36e; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  .corner {
    position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 0px) + 12px);
    width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,.28); color: #fff; border: none;
    font-size: 21px; line-height: 42px; text-align: center; text-decoration: none;
  }
  #backBtn { left: calc(env(safe-area-inset-left, 0px) + 12px); }
  #muteBtn { right: calc(env(safe-area-inset-right, 0px) + 12px); }
  #hud { position: fixed; z-index: 5; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px);
         display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
  .pill { background: rgba(0,0,0,.38); border-radius: 999px; padding: 5px 16px; font-weight: 900; font-size: 22px; text-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .row { display: flex; gap: 6px; }
  .small { font-size: 13px; padding: 4px 11px; }
  #money.bump { animation: bump .25s; }
  @keyframes bump { 50% { transform: scale(1.15); } }

  #action {
    position: fixed; z-index: 8; right: calc(env(safe-area-inset-right, 0px) + 16px);

    font-size: 20px; font-weight: 900; color: #fff; background: #5fbf6a;

  #action:disabled { background: #9a9a9a; box-shadow: 0 5px 0 #777; }
  #action:active { transform: translateY(3px); }

  #menuBtn { position: fixed; z-index: 8; right: calc(env(safe-area-inset-right, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);

    box-shadow: 0 4px 0 #c99400, 0 6px 16px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  #menuBtn small { font-size: 10px; margin-top: 3px; }

  #hint { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 132px);
    background: rgba(255,255,255,.93); color: #3a2a1a; border-radius: 14px; padding: 9px 15px; max-width: 92vw;

  #hint.hidden { opacity: 0; }
  #alert { position: fixed; z-index: 9; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 182px);

  @keyframes shake { 25% { transform: translateX(-52%); } 75% { transform: translateX(-48%); } }

  #joy { position: fixed; z-index: 6; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
         background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.45); pointer-events: none; display: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255,255,255,.75); }

  #toast { position: fixed; z-index: 11; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(.8);
    background: #ffcf3f; color: #4a2d00; border-radius: 18px; padding: 14px 22px; font-size: 21px; font-weight: 900;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; max-width: 88vw; }
  #toast small { font-size: 14px; font-weight: 700; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  #menu { position: fixed; z-index: 20; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
  #menu.hidden { display: none; }
  .sheet { width: 100%; max-width: 520px; max-height: 80vh; background: #fff8ec; color: #3a2a1a; border-radius: 24px 24px 0 0;
    padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; flex-direction: column; animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  .sheetHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sheetHead b { font-size: 20px; }
  #menuClose { width: 38px; height: 38px; border-radius: 50%; border: none; background: #eadfcb; font-size: 18px; font-weight: 900; color: #3a2a1a; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 9px 2px; border-radius: 12px; border: none; background: #eadfcb; color: #3a2a1a; font-weight: 800; font-size: 13px; white-space: nowrap; }

  .list { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
  .dex { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .buy:disabled { background: #cfc4b0; box-shadow: 0 3px 0 #b3a891; }
  #eventPill { background: linear-gradient(90deg, #ff7a59, #ffcf3f); color: #3a2000; text-shadow: none; font-size: 14px; animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 14px rgba(255,207,63,.9); } }
  #items { position: fixed; z-index: 8; left: calc(env(safe-area-inset-left, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; gap: 8px; }
  .item { width: 58px; height: 58px; border-radius: 18px; border: none; background: rgba(255,255,255,.92); font-size: 26px; position: relative; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .item b { position: absolute; right: -5px; top: -5px; background: #e8524a; color: #fff; font-size: 12px; min-width: 20px; height: 20px; border-radius: 10px; line-height: 20px; padding: 0 4px; }
  .item.on { background: #9dff7a; }
  .item:active { transform: translateY(2px); }
  .shopSec { font-weight: 900; font-size: 14px; margin: 6px 2px 0; }
  .card { background: #fff; border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 0 #eadfcb; }
  .card .ic { font-size: 30px; width: 40px; text-align: center; }
  .card .tx { flex: 1; min-width: 0; }
  .card .nm { font-weight: 900; font-size: 15px; }
  .card .ds { font-size: 12px; opacity: .75; margin-top: 2px; }
  .lv { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .lv i { width: 8px; height: 8px; border-radius: 50%; background: #e3d6bf; display: inline-block; }
  .lv i.on { background: #ffb020; }
  .sbuy { border: none; border-radius: 12px; padding: 10px 10px; min-width: 84px; font-weight: 900; font-size: 14px; background: #5fbf6a; color: #fff; box-shadow: 0 3px 0 #3f9a4a; }
  .sbuy:disabled { background: #cfc4b0; box-shadow: 0 3px 0 #b3a891; }
  .done { font-size: 13px; font-weight: 900; color: #3f9a4a; }
  .evlist { font-size: 12px; opacity: .8; line-height: 1.7; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; background: #8fd36e; z-index: 30; }
</style>

<body>

<a id="backBtn" class="corner" href="../" aria-label="ゲーム一覧にもどる">←</a>
<button id="muteBtn" class="corner" aria-label="音のオン・オフ">🔊</button>
<div id="hud">
  <div class="pill" id="money">💰 0</div>
  <div class="row">
    <div class="pill small" id="income">+0/秒</div>
    <div class="pill small" id="slots">🏠 0/8</div>
    <div class="pill small" id="lockInfo">🔓</div>
  </div>
  <div class="pill small" id="eventPill" style="display:none"></div>
</div>

<div id="alert"></div>
<div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<button id="action"></button>
<div id="items"></div>
<button id="menuBtn">📖<small>メニュー</small></button>
<div id="menu" class="hidden">
  <div class="sheet">

<script type="module">
import * as THREE from '../lib/three.min.js';
await window.gateReady;   // パスワードが通るまで待つ

// =====================================================================
//  データ
// =====================================================================
const SAVE_KEY = 'heist-save', MUTE_KEY = 'heist-muted', BEST_KEY = 'heist-best';
const params = new URLSearchParams(location.search);
const TEST = params.has('test');
const TIME_SCALE = TEST ? +(params.get('speed') || 1) : 1;

const RARITY = {
  common: { name: 'ふつう',     color: '#d7dde6', weight: 60 },
  rare:   { name: 'レア',       color: '#4fb8ff', weight: 25 },
  epic:   { name: 'エピック',   color: '#c08cff', weight: 10 },
  legend: { name: 'レジェンド', color: '#ffcf3f', weight: 3.8 },
  mythic: { name: 'ミシック',   color: '#ff5a5a', weight: 1 },
  secret: { name: 'ひみつ',     color: 'rainbow', weight: 0.2 },
};
const RARITY_ORDER = ['common', 'rare', 'epic', 'legend', 'mythic', 'secret'];
// ヘンテコたち（全部オリジナル）
const SPECIES = [
  { id: 'potepote', name: 'ポテポテ',           r: 'common', inc: 1,    price: 25,     color: 0xb58a5a },
  { id: 'koppun',   name: 'コップン',           r: 'common', inc: 2,    price: 60,     color: 0xf4f4f4 },
  { id: 'donut',    name: 'ドーナツマン',       r: 'common', inc: 3,    price: 95,     color: 0xff9fc6 },
  { id: 'toast',    name: 'トーストン',         r: 'rare',   inc: 10,   price: 320,    color: 0xf2d29b },
  { id: 'kasa',     name: 'カサオバケ',         r: 'rare',   inc: 14,   price: 480,    color: 0x8a5cd1 },
  { id: 'penguin',  name: 'ロケットペンギン',   r: 'epic',   inc: 45,   price: 1500,   color: 0x2b2b3a },
  { id: 'sabo',     name: 'トゲトゲサボ',       r: 'epic',   inc: 70,   price: 2500,   color: 0x4caf50 },
  { id: 'tako',     name: 'ウチュウタコ',       r: 'legend', inc: 250,  price: 9000,   color: 0xb05ce6 },
  { id: 'nasu',     name: 'キングナス',         r: 'legend', inc: 380,  price: 15000,  color: 0x5b2a86 },
  { id: 'namazu',   name: 'ギャラクシーナマズ', r: 'mythic', inc: 1500, price: 60000,  color: 0x1e2a6e },
  { id: 'burger',   name: 'バーガードラゴン',   r: 'mythic', inc: 2500, price: 110000, color: 0xd9a05b },
  { id: 'nyan',     name: 'ムゲンにゃん',       r: 'secret', inc: 9000, price: 450000, color: 0xffffff },
];
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));
const VARIANTS = {
  normal:  { name: '',         mult: 1, mark: '' },
  gold:    { name: 'ゴールド', mult: 2, mark: '✨' },
  rainbow: { name: 'にじいろ', mult: 5, mark: '🌈' },
  snow:    { name: 'ゆき',     mult: 3, mark: '❄️' },   // ゆきまつり限定
};
// ===== ショップ =====
const ITEMS_DEF = {
  banana: { icon: '🍌', name: 'バナナのかわ', price: 300, desc: '足元に置く。ふんだボットは転んで、持ってるヘンテコを落とす' },
  bubble: { icon: '🫧', name: 'あわバリア',   price: 500, desc: '12秒間、ボットにつかまらない' },
  warp:   { icon: '🌀', name: 'ワープ石',     price: 800, desc: '一瞬で自分の基地へワープ（運んでるヘンテコごと）' },
};
const UPGRADES = [
  { id: 'shoes',    icon: '👟', name: 'ジェットシューズ', costs: [200, 1500, 8000],     desc: (lv) => `歩くのが速くなる（+${12 * (lv + 1)}%）` },
  { id: 'expand',   icon: '🏠', name: '基地をひろげる',   costs: [5000],                desc: () => '台が 8 → 10 になる' },
  { id: 'lock',     icon: '🔒', name: 'つよいロック',     costs: [800, 6000],           desc: (lv) => `ロックの時間 ${LOCK_TIMES[lv]}秒 → ${LOCK_TIMES[lv + 1]}秒` },
  { id: 'luck',     icon: '🍀', name: 'ラッキーお守り',   costs: [1000, 8000, 40000],   desc: () => 'レアなヘンテコが来やすくなる' },
  { id: 'pedestal', icon: '💎', name: 'ピカピカ台座',     costs: [2500, 20000, 120000], desc: (lv) => `かせぎ ×${(1 + 0.25 * (lv + 1)).toFixed(2)}` },
];
const LOCK_TIMES = [45, 65, 90];
// ===== イベント =====
const EVENTS = [
  { id: 'rainbow', name: '🌈 にじいろフィーバー', desc: '色ちがいのヘンテコがたくさん来る！', dur: 75, sky: 0xd9c2ff },
  { id: 'rare',    name: '⭐ レアラッシュ',       desc: 'レアなヘンテコが出やすい！',         dur: 75, sky: 0xffe9a8 },
  { id: 'golden',  name: '💰 ゴールデンタイム',   desc: 'かせぎが2倍！',                      dur: 60, sky: 0xffd77a },
  { id: 'snow',    name: '❄️ ゆきまつり',         desc: '限定の❄️ゆきヘンテコ（×3）が来る！', dur: 90, sky: 0xdff2ff },
  { id: 'peace',   name: '🕊️ へいわタイム',       desc: 'どろぼうが来ない＆運ぶのが速い！',   dur: 60, sky: 0xc8f5d8 },
  { id: 'parade',  name: '🐲 ボスパレード',       desc: 'すごいヘンテコがやってくる！',       dur: 45, sky: 0xffb3a8 },
];
const SLOTS_PER_BASE = 8;
const slotLimit = () => SLOTS_PER_BASE + (save.shop.expand ? 2 : 0);

// =====================================================================
//  セーブ
// =====================================================================
const save = { money: 50, rebirths: 0, slots: [], dex: {}, earned: 0, steals: 0, stolen: 0, caught: 0, bought: 0, tutorial: 0, last: 0,
  shop: { shoes: 0, expand: 0, lock: 0, luck: 0, pedestal: 0 }, items: { banana: 0, bubble: 0, warp: 0 }, events: 0, slipped: 0 };
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s) { const d = { shop: save.shop, items: save.items }; Object.assign(save, s); save.shop = Object.assign(d.shop, s.shop); save.items = Object.assign(d.items, s.items); }
} catch (e) {}
const incomeMult = () => 1 + save.rebirths * 0.5;
const rebirthCost = () => 50000 * Math.pow(3, save.rebirths);
function writeSave() {
  save.slots = playerBase ? playerBase.slots.map(sl => sl.cr ? { sp: sl.cr.sp.id, v: sl.cr.variant, acc: Math.floor(sl.acc) } : (sl.reserved && sl.reservedCr ? { sp: sl.reservedCr.sp.id, v: sl.reservedCr.variant, acc: 0 } : null)) : save.slots;
  save.last = Date.now();
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    const best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
    if (save.earned > best) localStorage.setItem(BEST_KEY, String(Math.floor(save.earned)));
  } catch (e) {}
}
function discover(cr) {
  const d = save.dex[cr.sp.id] || (save.dex[cr.sp.id] = []);
  if (!d.includes(cr.variant)) { d.push(cr.variant); return true; }
  return false;
}
const fmt = (n) => {
  n = Math.floor(n);
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '億';
  if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e6 ? 0 : 1).replace(/\.0$/, '') + '万';
  return String(n);
};

// =====================================================================
//  サウンド
// =====================================================================
let audio = null, muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
const muteBtn = document.getElementById('muteBtn');
const showMute = () => { muteBtn.textContent = muted ? '🔇' : '🔊'; };
showMute();
muteBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); muted = !muted; try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (err) {} showMute(); });
document.getElementById('backBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); writeSave(); location.href = '../'; });
function initAudio() {
  if (!audio) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) audio = new AC(); }
  if (audio && audio.state === 'suspended') audio.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
  if (!audio || muted) return;
  const t = audio.currentTime + delay;
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  buy()    { beep(880, 0.08, 'triangle', 0.1); beep(1320, 0.15, 'triangle', 0.1, null, 0.08); },
  coin()   { beep(1000 + Math.random() * 400, 0.06, 'sine', 0.07); },
  steal()  { beep(300, 0.08, 'square', 0.07, 600); beep(600, 0.1, 'square', 0.07, 900, 0.08); },
  place()  { [523, 659, 784].forEach((f, i) => beep(f, 0.12, 'triangle', 0.1, null, i * 0.07)); },
  caught() { beep(400, 0.3, 'sawtooth', 0.08, 120); },
  alarm()  { for (let i = 0; i < 4; i++) beep(i % 2 ? 700 : 950, 0.12, 'square', 0.06, null, i * 0.14); },
  lock()   { beep(300, 0.1, 'square', 0.08); beep(200, 0.2, 'square', 0.08, null, 0.1); },
  sell()   { beep(700, 0.1, 'triangle', 0.08, 400); },
  rare()   { [523, 659, 784, 1046, 1318].forEach((f, i) => beep(f, 0.18, 'triangle', 0.1, null, i * 0.08)); },
};

// =====================================================================
//  three.js
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

function baseAt(p) { return bases.find(b => inBase(b, p, 0.5)); }
function route(a, b) {
  const pts = [];
  const ba = baseAt(a), bb = baseAt(b);
  if (ba && ba !== bb) pts.push(ba.w(HALF_X - 1, 0), ba.w(HALF_X + 1.4, 0));
  if (bb && ba !== bb) pts.push(bb.w(HALF_X + 1.4, 0), bb.w(HALF_X - 1, 0));
  pts.push(V(b.x, 0, b.z));
  return pts;
}
function followPath(o, dt, speed) {
  if (!o.path || !o.path.length) { o.moving = false; return true; }
  const pos = o.pos || o.obj.position;
  const t = o.path[0];
  const dx = t.x - pos.x, dz = t.z - pos.z, d = Math.hypot(dx, dz), step = speed * dt;
  o.moving = true;
  if (d > 0.01) {
    let diff = Math.atan2(dx, dz) - o.obj.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
    o.obj.rotation.y += diff * Math.min(1, dt * 12);
  }
  if (d <= step) { pos.x = t.x; pos.z = t.z; o.path.shift(); if (!o.path.length) { o.moving = false; return true; } }
  else { pos.x += dx / d * step; pos.z += dz / d * step; }
  return false;
}

// =====================================================================
//  プレイヤーの行動（かう・ぬすむ・うる）
// =====================================================================
const actionEl = document.getElementById('action');
let currentAction = null;
function findAction() {
  if (player.carry) return null;
  let best = null, bd = 1e9;
  const consider = (d, act) => { if (d < bd) { bd = d; best = act; } };
  for (const cr of carpet) {
    const d = Math.hypot(cr.obj.position.x - player.pos.x, cr.obj.position.z - player.pos.z);
    if (d < 2.6) consider(d, { kind: 'buy', cr });
  }
  for (const b of bases) {
    if (!inBase(b, player.pos, 0.3)) continue;
    for (const s of b.slots) {
      if (!s.cr) continue;
      const d = Math.hypot(s.pos.x - player.pos.x, s.pos.z - player.pos.z);
      if (d < 1.9) consider(d, b.owner === 'player' ? { kind: 'sell', slot: s } : { kind: 'steal', base: b, slot: s });
    }
  }
  return best;
}
function renderAction(a) {
  const key = a ? a.kind + (a.cr ? a.cr.obj.id : a.slot.i + a.kind) + save.money : '';
  if (key === actionEl.dataset.key) return;
  actionEl.dataset.key = key;
  if (!a) { actionEl.style.display = 'none'; return; }
  actionEl.style.display = 'block';
  actionEl.className = a.kind === 'steal' ? 'steal' : a.kind === 'sell' ? 'sell' : '';
  if (a.kind === 'buy') {
    const p = crPrice(a.cr);
    actionEl.innerHTML = `🛒 かう<small>💰${fmt(p)}</small>`;
    actionEl.disabled = save.money < p || !freeSlot(playerBase);
    if (!freeSlot(playerBase)) actionEl.innerHTML = `🛒 かう<small>基地がいっぱい</small>`;
  } else if (a.kind === 'steal') {
    actionEl.innerHTML = `🦹 ぬすむ<small>${a.slot.cr.sp.name}</small>`; actionEl.disabled = false;
  } else {
    actionEl.innerHTML = `💸 うる<small>💰${fmt(crPrice(a.slot.cr) / 2)}</small>`; actionEl.disabled = false;
  }
}
actionEl.addEventListener('pointerdown', (e) => {
  e.preventDefault(); e.stopPropagation(); initAudio();
  const a = currentAction; if (!a || actionEl.disabled) return;
  if (a.kind === 'buy') doBuy(a.cr);
  else if (a.kind === 'steal') doSteal(a.base, a.slot);
  else doSell(a.slot);
  actionEl.dataset.key = '__';   // 次のフレームで必ず描き直す
});
function doBuy(cr) {
  const p = crPrice(cr), slot = freeSlot(playerBase);
  if (save.money < p || !slot || cr.state !== 'carpet') return;
  save.money -= p; save.bought++;
  carpet.splice(carpet.indexOf(cr), 1);
  sendToBase(cr, playerBase, slot);
  sfx.buy(); hopObj(cr.obj);
  floatText(`-💰${fmt(p)}`, cr.obj.position.clone().setY(2.6), { color: '#ffb0b0' });
  if (discover(cr)) floatText('📖 図鑑に登録！', cr.obj.position.clone().setY(3.3), { color: '#ffe066', size: 0.8 });
  if (save.tutorial === 0) setTutorial(1);
  updateHud(true); writeSave();
}
function doSell(slot) {
  const cr = removeFromSlot(slot);
  const v = Math.floor(crPrice(cr) / 2) + Math.floor(slot.acc);
  slot.acc = 0;
  save.money += v; save.earned += v;
  sfx.sell();
  floatText(`+💰${fmt(v)}`, slot.pos.clone().setY(2.2), { color: '#ffe066' });
  tween(0.3, (p) => cr.obj.scale.setScalar(Math.max(0.001, 1 - p)), () => scene.remove(cr.obj));
  updateHud(true); writeSave();
}
function doSteal(base, slot) {
  const cr = removeFromSlot(slot, true);
  cr.state = 'carried'; cr.from = { base, slot };
  player.carry = cr;
  player.obj.add(cr.obj);
  cr.obj.position.set(0, 1.45, 0); cr.obj.rotation.set(0, 0, 0); cr.obj.scale.setScalar(0.75);
  sfx.steal();
  floatText('🦹 ぬすんだ！', player.pos.clone().setY(3), { color: '#ff8080' });
  // 持ち主が気づく
  const owner = bots.find(bt => bt.base === base);
  if (owner && owner.state !== 'steal' && owner.pos.distanceTo(player.pos) < 14) { owner.state = 'chase'; owner.chase = 10; owner.alertMark.visible = true; floatText('！', owner.pos.clone().setY(2.8), { color: '#ff4040', size: 1.2 }); }
}
function dropCarried(who) {
  // つかまった → ヘンテコはもとの台へ帰る
  const cr = who.carry; who.carry = null;
  who.obj.remove(cr.obj);
  const wp = (who.pos).clone();
  cr.obj.position.set(wp.x, 0.05, wp.z); cr.obj.scale.setScalar(1);
  scene.add(cr.obj);
  const { base, slot } = cr.from;
  cr.state = 'walking'; cr.base = base; cr.slot = slot; cr.owner = base.owner;
  cr.path = route(wp, slot.pos);
  walkers.push(cr);
}
const hopObj = (o) => { const y0 = o.position.y; tween(0.35, (p) => { o.position.y = y0 + Math.sin(p * Math.PI) * 0.6; }); };

let stealCd = 60;
function botAlert(text) { const el = document.getElementById('alert'); el.textContent = text; el.style.display = text ? 'block' : 'none'; }
function updateBot(bot, dt) {
  const b = bot.base;
  // バナナで転んでいる
  if (bot.stun > 0) {
    bot.stun -= dt;
    bot.obj.rotation.y += dt * 14;
    bot.obj.userData.inner.rotation.x = Math.min(1.3, bot.obj.userData.inner.rotation.x + dt * 8);
    if (bot.stun <= 0) { bot.obj.userData.inner.rotation.x = 0; }
    bot.obj.position.copy(bot.pos);
    return;
  }
  const spd = { home: 2.6, buy: 3.0, steal: 3.4, flee: 3.0, chase: 3.6, back: 3.0 }[bot.state] || 3;
  bot.timer -= dt; bot.lockCd -= dt;
  // かせぎ
  for (const s of b.slots) if (s.cr) bot.money += s.cr.sp.inc * VARIANTS[s.cr.variant].mult * 0.6 * dt;
  switch (bot.state) {
    case 'home': {
      followPath(bot, dt, spd);
      if (bot.timer > 0) break;
      bot.timer = 3 + Math.random() * 4;
      const r = Math.random();
      if (!isLocked(b) && bot.lockCd <= 0 && r < 0.18) {
        // 自分の基地をロック
        bot.path = route(bot.pos, b.lockPos); bot.state = 'toLock'; break;
      }
      if (freeSlot(b) && r < 0.7) {

    html += `<div class="stat"><span>📖 見つけたヘンテコ</span><span>${found} / ${SPECIES.length}</span></div><div class="dex">`;
    for (const s of SPECIES) {
      const d = save.dex[s.id], rr = RARITY[s.r];
      const col = rr.color === 'rainbow' ? 'linear-gradient(90deg,#ff5a5a,#ffcf3f,#5fd16a,#4fb8ff,#c08cff)' : rr.color;
      if (!d) { html += `<div class="dexc unk"><div class="dot" style="background:#ccc"></div><div class="nm">？？？</div><div class="rr" style="color:#999">${rr.name}</div></div>`; continue; }
      html += `<div class="dexc"><div class="dot" style="background:#${new THREE.Color(s.color).getHexString()}"></div><div class="nm">${s.name}</div>
        <div class="rr" style="${rr.color === 'rainbow' ? 'color:#c08cff' : 'color:' + rr.color};text-shadow:0 0 1px #0004">${rr.name}</div>
        <div style="font-size:10px;opacity:.7">+${fmt(s.inc)}/秒</div>
        <div class="vv">${d.includes('normal') ? '●' : '○'}${d.includes('gold') ? '✨' : '・'}${d.includes('rainbow') ? '🌈' : '・'}${d.includes('snow') ? '❄️' : '・'}</div></div>`;
    }
    html += '</div><div style="font-size:11px;opacity:.6;text-align:center">● ふつう ✨ ゴールド(×2) 🌈 にじいろ(×5) ❄️ ゆき(×3・イベント限定)</div>';
  } else if (menuTab === 'rebirth') {
    const cost = rebirthCost();
    html += `<div class="big">🔁 <b>リバース</b>（${save.rebirths}回）<br>お金とヘンテコがぜんぶ消えるかわりに、<br>かせぐお金が <b>×${(incomeMult() + 0.5).toFixed(1)}</b> になるよ（今は ×${incomeMult().toFixed(1)}）<br>レアなヘンテコも出やすくなる！<br><br>必要なお金：💰${fmt(cost)}
      <button class="buy" id="rebirthBtn" ${save.money < cost ? 'disabled' : ''}>リバースする</button></div>`;
  } else {
    html += `<div class="stat"><span>💰 かせいだ合計</span><span>${fmt(save.earned)}</span></div>`;
    html += `<div class="stat"><span>🛒 買った数</span><span>${save.bought}</span></div>`;
    html += `<div class="stat"><span>🦹 ぬすんだ数</span><span>${save.steals}</span></div>`;
    html += `<div class="stat"><span>😈 ぬすまれた数</span><span>${save.stolen}</span></div>`;
    html += `<div class="stat"><span>🚓 つかまった数</span><span>${save.caught}</span></div>`;
    html += `<div class="stat"><span>🔁 リバース</span><span>${save.rebirths}回</span></div>`;
    html += `<div class="stat"><span>🎪 参加したイベント</span><span>${save.events}回</span></div>`;
    html += `<div class="stat"><span>🍌 転ばせたボット</span><span>${save.slipped}回</span></div>`;
    html += `<button class="buy" id="resetBtn" style="background:#bbb;box-shadow:0 3px 0 #999">データを消して最初から</button>`;
  }
  menuList.innerHTML = html;
}
document.getElementById('menuBtn').addEventListener('pointerup', (e) => { e.preventDefault(); initAudio(); openMenu(); });
document.getElementById('menuClose').addEventListener('pointerup', (e) => { e.preventDefault(); menuEl.classList.add('hidden'); });
menuEl.addEventListener('pointerup', (e) => { if (e.target === menuEl) menuEl.classList.add('hidden'); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('pointerup', (e) => { e.preventDefault(); menuTab = t.dataset.tab; renderMenu(); }));
menuList.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.buyitem) {
    const it = ITEMS_DEF[b.dataset.buyitem];
    if (save.money < it.price) return;
    save.money -= it.price; save.items[b.dataset.buyitem]++;
    sfx.buy(); floatText(`${it.icon} ゲット！`, player.pos.clone().setY(2.6), { size: 0.8 });
    writeSave(); renderItems(); updateHud(true); renderMenu();
    return;
  }
  if (b.dataset.up) {
    const u = UPGRADES.find(x => x.id === b.dataset.up);
    const cost = u.costs[save.shop[u.id]];
    if (save.money < cost) return;
    save.money -= cost; save.shop[u.id]++;
    if (u.id === 'expand') unlockExtraSlots(true);
    sfx.rare(); burst(player.pos.clone().setY(2), 40, 6);
    floatText(`${u.icon} レベルアップ！`, player.pos.clone().setY(2.6), { color: '#ffe066', size: 0.8 });
    writeSave(); updateHud(true); renderMenu();
    return;
  }
  if (b.id === 'rebirthBtn') {
    if (save.money < rebirthCost()) return;
    save.money = 0; save.rebirths++;
    for (const s of playerBase.slots) { if (s.cr) scene.remove(s.cr.obj); s.cr = null; s.acc = 0; s.reserved = false; }
    if (player.carry) { player.obj.remove(player.carry.obj); player.carry = null; }
    save.money = 100;
    writeSave(); menuEl.classList.add('hidden');
    sfx.rare(); burst(player.pos.clone().setY(2), 100, 8);
    toast(`🔁 リバース！<br><small>かせぎが ×${incomeMult().toFixed(1)} になった！</small>`);
    updateHud(true);
  } else if (b.id === 'resetBtn') {
    if (b.dataset.sure) { try { localStorage.removeItem(SAVE_KEY); } catch (err) {} location.reload(); return; }
    b.dataset.sure = '1'; b.textContent = 'ほんとうに消す？（もう一度押す）'; b.style.background = '#e84a4a';
  }
});

// =====================================================================
//  操作
// =====================================================================
const joyEl = document.getElementById('joy'), knobEl = document.getElementById('knob');
const joy = { active: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };
const keys = {};
// 画面のどこを触ってもスティックが出る（ボタンやメニューはのぞく）
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('button, a, #menu, #items, #gate')) return;
  initAudio(); if (joy.active) return;
  joy.active = true; joy.id = e.pointerId; joy.sx = e.clientX; joy.sy = e.clientY; joy.dx = joy.dy = 0;
  joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.style.display = 'block'; knobEl.style.transform = 'translate(0,0)';
});
window.addEventListener('pointermove', (e) => {
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.sx, dy = e.clientY - joy.sy; const d = Math.hypot(dx, dy), max = 50;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  joy.dx = dx / max; joy.dy = dy / max; knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
});
const endJoy = (e) => { if (e.pointerId !== joy.id) return; joy.active = false; joy.dx = joy.dy = 0; joyEl.style.display = 'none'; };
window.addEventListener('pointerup', endJoy);
window.addEventListener('pointercancel', endJoy);
window.addEventListener('keydown', (e) => { keys[e.code] = true; initAudio(); if (e.code === 'Space' && currentAction) actionEl.dispatchEvent(new Event('pointerdown')); });
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
document.addEventListener('touchstart', (e) => { if (!e.target.closest('button, a, #menu')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', (e) => e.preventDefault());

// =====================================================================
//  スタート
// =====================================================================
let elapsed = 0;
// セーブからヘンテコをもどす
if (save.shop.expand) unlockExtraSlots(false);
(save.slots || []).forEach((d, i) => {
  if (!d || !SP[d.sp] || i >= playerBase.slots.length) return;
  if (playerBase.slots[i].locked) return;
  const cr = makeCr(d.sp, d.v || 'normal');
  playerBase.slots[i].acc = d.acc || 0;
  placeOnSlot(playerBase, playerBase.slots[i], cr, false);
});
seedBots();
for (let z = CARPET_Z0 + 4; z < CARPET_Z1 - 4; z += 6) spawnCarpet(z);
toastEl.classList.remove('show');
// 留守のあいだのかせぎ（最大1時間ぶんの半分）
if (save.last) {
  const away = Math.min(3600, (Date.now() - save.last) / 1000);
  const inc = totalIncome();
  if (away > 30 && inc > 0) {
    const got = Math.floor(inc * away * 0.5);
    save.money += got; save.earned += got;
    setTimeout(() => toast(`👋 おかえり！<br><small>留守のあいだに 💰${fmt(got)} かせいだよ</small>`), 600);
  }
}
updateHud();
renderItems();

function blockers() {
  const list = [];
  for (const b of bases) { list.push(...b.walls); if (b.owner !== 'player' && isLocked(b)) list.push(b.gateBox); }
  return list;
}
const BOUNDS = 26;

// =====================================================================
//  メインループ
// =====================================================================
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3().copy(player.pos);
let saveTimer = 0, hudTimer = 0, labelTimer = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20) * TIME_SCALE;
  elapsed += dt;

  // プレイヤー
  let mx = joy.dx, mz = joy.dy;
  if (keys.ArrowLeft || keys.KeyA) mx = -1; if (keys.ArrowRight || keys.KeyD) mx = 1;
  if (keys.ArrowUp || keys.KeyW) mz = -1; if (keys.ArrowDown || keys.KeyS) mz = 1;
  const mag = Math.min(1, Math.hypot(mx, mz));
  player.moving = mag > 0.15;
  if (player.moving) {
    const n = Math.hypot(mx, mz), sp = (player.carry ? (eventIs('peace') ? 4.8 : 3.6) : 5.4) * (1 + 0.12 * save.shop.shoes) * mag;
    const nx = player.pos.x + mx / n * sp * dt, nz = player.pos.z + mz / n * sp * dt;
    const bl = blockers();
    const hit = (x, z) => bl.some(b => x > b.x1 - 0.35 && x < b.x2 + 0.35 && z > b.z1 - 0.35 && z < b.z2 + 0.35);
    if (!hit(nx, player.pos.z)) player.pos.x = nx;
    if (!hit(player.pos.x, nz)) player.pos.z = nz;
    player.pos.x = Math.max(-BOUNDS, Math.min(BOUNDS, player.pos.x));
    player.pos.z = Math.max(CARPET_Z0, Math.min(CARPET_Z1, player.pos.z));
    let diff = Math.atan2(mx, mz) - player.dir;
    while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2;
    player.dir += diff * Math.min(1, dt * 14);
  }
  player.obj.position.copy(player.pos); player.obj.rotation.y = player.dir;
  animateChar(player.obj, player.moving, elapsed);
  if (player.carry) {
    animateCreature(player.carry, elapsed, true);
    // 自分の基地に着いたら置く
    if (inBase(playerBase, player.pos, -0.3)) {
      const slot = freeSlot(playerBase);
      if (slot) {
        const cr = player.carry; player.carry = null; player.obj.remove(cr.obj);
        const from = cr.from; from.slot.reserved = false; from.slot.reservedCr = null;
        placeOnSlot(playerBase, slot, cr);
        save.steals++; sfx.place(); burst(slot.pos.clone().setY(1.5), 50, 6);
        floatText('🎉 ゲット！', slot.pos.clone().setY(2.8), { color: '#ffe066' });
        if (discover(cr)) floatText('📖 図鑑に登録！', slot.pos.clone().setY(3.5), { color: '#ffe066', size: 0.8 });
        if (save.tutorial === 2) setTutorial(3);
        bots.forEach(b => { if (b.state === 'chase') { b.state = 'back'; b.alertMark.visible = false; b.path = route(b.pos, b.base.w(0, 0)); } });
        updateHud(true); writeSave();
      }
    }
  }
  // どろぼうに体当たり
  for (const bot of bots) {
    if (bot.carry && bot.pos.distanceTo(player.pos) < 1.0) {
      const name = bot.carry.sp.name;
      dropCarried(bot);
      bot.state = 'back'; bot.alertMark.visible = false; bot.path = route(bot.pos, bot.base.w(0, 0));
      sfx.place(); camShake = 0.3; botAlert('');
      floatText(`💪 「${name}」を取り返した！`, player.pos.clone().setY(3), { color: '#9dff7a', size: 0.8 });
    }
  }

  // ロックボタン
  if (!isLocked(playerBase) && Math.hypot(player.pos.x - playerBase.lockPos.x, player.pos.z - playerBase.lockPos.z) < 0.7) {
    playerBase.lockUntil = elapsed + LOCK_TIMES[save.shop.lock]; sfx.lock(); camShake = 0.15;
    floatText('🔒 ロック！', playerBase.lockPos.clone().setY(2.2), { color: '#ff8080' });
    if (save.tutorial === 3) setTutorial(4);
  }
  for (const b of bases) {
    const locked = isLocked(b);
    b.gate.visible = locked;
    b.lockBtn.position.y = locked ? 0.26 : 0.34;
    b.gateLabel.visible = locked;
    if (locked) {
      const sec = Math.ceil(b.lockUntil - elapsed);
      if (b.gateLabel.userData.sec !== sec) {
        b.gateLabel.userData.sec = sec;
        if (b.gateLabel.material.map) b.gateLabel.material.map.dispose();
        b.gateLabel.material.map = canvasTex(256, 64, (g) => { g.fillStyle = 'rgba(200,30,30,.85)'; g.beginPath(); g.roundRect(4, 4, 248, 56, 20); g.fill(); g.fillStyle = '#fff'; g.font = '900 38px -apple-system, "Hiragino Sans", "Apple Color Emoji", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(`🔒 ${sec}`, 128, 34); });
        b.gateLabel.material.needsUpdate = true;
      }
      b.gate.children.forEach((l, k) => { if (l.material.opacity !== undefined && k < 5) l.scale.x = 1 + Math.sin(elapsed * 20 + k) * 0.3; });
    }
  }
  lockEl.textContent = isLocked(playerBase) ? `🔒 ${Math.ceil(playerBase.lockUntil - elapsed)}` : '🔓';

  // じゅうたん
  carpetTimer -= dt;
  if (carpetTimer <= 0) { spawnCarpet(); carpetTimer = (2.6 + Math.random() * 1.2) * (eventIs('parade') || eventIs('rare') ? 0.7 : 1); }
  for (let i = carpet.length - 1; i >= 0; i--) {
    const cr = carpet[i];
    cr.obj.position.z += CARPET_SPEED * dt; cr.obj.rotation.y = 0;
    animateCreature(cr, elapsed, true);
    if (cr.obj.position.z > CARPET_Z1) { scene.remove(cr.obj); carpet.splice(i, 1); }
  }
  for (const a of carpetArrows) { a.position.z += CARPET_SPEED * dt; if (a.position.z > CARPET_Z1) a.position.z -= (CARPET_Z1 - CARPET_Z0 - 2); }
  // 歩いていくヘンテコ
  for (let i = walkers.length - 1; i >= 0; i--) {
    const cr = walkers[i];
    animateCreature(cr, elapsed, true);
    if (followPath(cr, dt, 3.2)) { walkers.splice(i, 1); placeOnSlot(cr.base, cr.slot, cr); if (cr.base === playerBase) { sfx.place(); updateHud(); } }
  }
  // かせぎ
  for (const s of playerBase.slots) if (s.cr) { s.acc += crIncome(s.cr) * dt; animateCreature(s.cr, elapsed, false); }
  for (const b of bases) if (b !== playerBase) for (const s of b.slots) if (s.cr) animateCreature(s.cr, elapsed, false);
  // 回収
  for (const s of playerBase.slots) {
    s.ring.material.opacity = s.cr && s.acc >= 1 ? 0.6 + Math.sin(elapsed * 5) * 0.3 : 0.3;
    if (s.cr && s.acc >= 1 && Math.hypot(player.pos.x - s.plate.x, player.pos.z - s.plate.z) < 0.75) {
      const v = Math.floor(s.acc); s.acc -= v;
      save.money += v; save.earned += v;
      sfx.coin(); floatText(`+💰${fmt(v)}`, s.plate.clone().setY(1.6), { color: '#ffe066', size: 0.8 });
      if (save.tutorial === 1) { setTutorial(2); tutTimer = 0; }
      updateHud(true);
    }
  }
  labelTimer -= dt;
  if (labelTimer <= 0) { labelTimer = 0.4; for (const s of playerBase.slots) if (s.cr) setLabel(s.cr, 'acc', s.acc); }

  // ボット
  for (const bot of bots) { updateBot(bot, dt); if (!(bot.stun > 0)) animateChar(bot.obj, bot.moving, elapsed + bot.i); }
  maybeStartSteal(dt);
  updateItems(dt);
  updateEvents(dt);
  updateShopStand();

  // 行動ボタン
  currentAction = findAction();
  renderAction(currentAction);

  // アニメーション
  rainbowMat.color.copy(RAINBOW(elapsed));
  for (let i = 0; i < tweens.length; i++) {
    const tw = tweens[i]; tw.t += dt; if (tw.t < 0) continue;
    const p = Math.min(1, tw.t / tw.dur); tw.fn(p);
    if (p >= 1) { tweens.splice(i--, 1); if (tw.done) tw.done(); }
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i]; c.t += dt; c.vy -= 9 * dt; if (c.vy < -2) c.vy = -2;
    c.m.position.x += c.vx * dt; c.m.position.y += c.vy * dt; c.m.position.z += c.vz * dt; c.m.rotation.x += c.r * dt; c.m.rotation.y += c.r * 0.7 * dt;
    if (c.t > c.life || c.m.position.y < 0) { scene.remove(c.m); confetti.splice(i, 1); }
  }
  updateTutorial(dt);
  hudTimer -= dt; if (hudTimer <= 0) { hudTimer = 0.5; updateHud(); }

  // カメラ
  camTarget.lerp(player.pos, Math.min(1, dt * 6));
  camera.position.copy(camTarget).addScaledVector(CAM_OFFSET, camera.aspect < 0.7 ? 1.15 : 1);
  if (camShake > 0) { camShake -= dt; camera.position.x += (Math.random() - 0.5) * camShake; camera.position.y += (Math.random() - 0.5) * camShake; }
  camera.lookAt(camTarget.x, 0.5, camTarget.z);
  sun.position.set(camTarget.x + 8, 18, camTarget.z + 6); sun.target.position.copy(camTarget);

  saveTimer += dt; if (saveTimer > 4) { saveTimer = 0; writeSave(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
document.getElementById('loading').remove();
requestAnimationFrame(frame);
window.addEventListener('pagehide', writeSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) writeSave(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('../sw.js').catch(() => {});
if (TEST) window.__heist = { save, player, bots, bases, carpet, walkers, doBuy, doSteal, startEvent: (i) => startEvent(EVENTS[i]), get event() { return event; }, useItem, peels, openMenu, get action() { return currentAction; }, setStealCd: (v) => { stealCd = v; }, get elapsed() { return elapsed; } };
</script>
</body>
